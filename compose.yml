services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/storage/app/public
    networks: [internal]
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ./public:/var/www/html/public
      - uploads:/var/www/html/public/storage:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.dgimoveis.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)
      - traefik.http.routers.dgimoveis.entrypoints=websecure
      - traefik.http.routers.dgimoveis.tls=true
      - traefik.http.routers.dgimoveis.tls.certresolver=letsencrypt
      - traefik.http.routers.dgimoveis.middlewares=dgimoveis-www
      - traefik.http.middlewares.dgimoveis-www.redirectregex.regex=^https?://www\.(.+)
      - traefik.http.middlewares.dgimoveis-www.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.dgimoveis-www.redirectregex.permanent=true
      - traefik.http.services.dgimoveis.loadbalancer.server.port=80
  scheduler:
    build: .
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/storage/app/public
      - backups:/var/www/html/storage/app/backups
    networks: [internal]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-debora_guedes}
      POSTGRES_USER: ${DB_USERNAME:-debora_guedes}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [/bin/sh, /scripts/backup.sh]
    volumes:
      - ./docker/backup.sh:/scripts/backup.sh:ro
      - backups:/backups
    networks: [internal]
volumes:
  postgres_data:
  uploads:
  backups:
networks:
  internal:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
